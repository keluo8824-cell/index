html,

body{

.page{

}

.card{
    position:relative;
    width:100%;
    padding:28px;

    background:rgba(255,255,255,.88);

}

.card::before{
    content:"";
    position:absolute;

    width:180px;
    height:180px;

    top:-100px;
    right:-80px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            rgba(59,130,246,.18),
            rgba(6,182,212,.06)

.logo{

.address-btn{

    align-items:center;
    justify-content:center;
    flex-direction:column;

    text-decoration:none;

    border:1px solid rgba(255,255,255,.9);

    overflow:hidden;

    cursor:pointer;

.address-btn::before{

.address-btn:hover{

.address-btn:active{
    transform:

}

.address-icon{

    width:38px;
    height:38px;

    margin-bottom:8px;

    align-items:center;
    justify-content:center;

    border-radius:12px;

.address-icon{

.address-btn:nth-child(2){

.address-icon{

        );

.address-btn:nth-child(3)
.address-icon{
    background:

            #22c55e

.address-btn:nth-child(4){
    background:
        linear-gradient(
            135deg,

.address-btn:nth-child(4)
.address-icon{
    background:

            #f59e0b
        );
}

.address-btn.loading{
    cursor:default;
    opacity:.62;
    filter:saturate(.7);
}

.address-btn.loading:hover{
    transform:none;

    box-shadow:
        0 7px 20px rgba(30,60,90,.07);
}

.auto-btn{
    position:relative;

    width:100%;

    min-height:96px;

    margin-top:14px;

    padding:16px 20px;

    border:0;

    border-radius:20px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

        transform .22s ease,
        box-shadow .22s ease,
        filter .22s ease;
}

.auto-btn::before{
    content:"";

    position:absolute;

    width:180px;
    height:180px;

    top:-120px;
    right:-45px;

    border-radius:50%;

    background:
        rgba(255,255,255,.14);
}

.auto-btn::after{
    content:"";

    position:absolute;

    width:120px;

    bottom:-80px;
    left:-30px;

    border-radius:50%;

    background:
        rgba(255,255,255,.10);
}

.auto-btn:hover{

    box-shadow:

.auto-btn:active{

.auto-btn:disabled{

.auto-title{

.browser-icon{

.browser-desc{

.browser-link{

/* === 页面纵向排版优化（保留顶部标题和牢记入口原样） === */
html { min-height: 100%; }
body {
  min-height: 100vh;
  min-height: 100dvh;
  align-items: flex-start;
  justify-content: center;
}
.page { width: 100%; max-width: 408px; }
.card {
  display: flex;
  flex-direction: column;
  min-height: calc(100vh - 36px);
  min-height: calc(100dvh - 36px);
}
/* 最新地址区整体下移，按钮仍按原来的两列排列 */
.address-grid { margin-top: clamp(95px, 20vh, 230px) !important; }
/* 中间的剩余空间留给浏览器下载区，把下载区推到底部 */
.browser-box { margin-top: auto; }
.status { margin-bottom: 18px; }
.footer { margin-top: 12px; }
@media (max-width: 520px) {
  .card {
    min-height: calc(100vh - 28px);
    min-height: calc(100dvh - 28px);
  }
  .address-grid { margin-top: clamp(85px, 17vh, 170px) !important; }
}
/* 屏幕高度较小时允许自然滚动，防止地址按钮和下载区相互覆盖 */
@media (max-height: 690px) {
  .address-grid { margin-top: 45px !important; }
  .browser-box { margin-top: 32px; }
}
